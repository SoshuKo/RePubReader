<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="『共和国物語』サーガの登場人物紹介。">
<link rel="icon" type="image/png" href="./assets/images/アイコン.png">
<title>登場人物紹介 | 『共和国物語』サーガ</title>
<style>
:root{--bg:#fff;--paper:#fff;--soft:#faf9f6;--line:#ddd9d0;--ink:#202124;--muted:#77736c;--accent:#9b6b21;--blue:#315f91;--shadow:0 14px 36px rgba(36,34,30,.1)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit;color:inherit}.shell{width:min(1280px,calc(100% - 28px));margin:auto}
.hero{padding:max(34px,env(safe-area-inset-top)) 0 24px;border-bottom:1px solid var(--line)}.back{display:inline-block;margin-bottom:22px;color:#315f91;text-decoration:none;font-size:.86rem}.eyebrow{display:flex;align-items:center;gap:10px;color:var(--accent);font-size:.75rem;font-weight:800;letter-spacing:.18em}.eyebrow:before{content:"";width:32px;height:2px;background:var(--accent)}h1{margin:10px 0 4px;font-size:clamp(2rem,6vw,4.5rem);line-height:.95;letter-spacing:-.04em}.sub{color:var(--muted);font-size:.92rem}
.toolbar{position:sticky;top:0;z-index:20;padding:11px 0;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.row{display:flex;gap:9px}.search{flex:1;min-width:0}.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;outline:none}.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(49,95,145,.1)}.count{white-space:nowrap;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.8rem;color:var(--muted)}.filters{display:flex;gap:7px;overflow:auto;padding-top:8px;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.filter{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:.75rem;font-weight:700;color:var(--muted)}.filter.on{background:#282725;color:#fff;border-color:#282725}
main{padding:22px 0 64px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{padding:0;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:.18s}.card:hover,.card:focus-visible{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#c9c3b8;outline:none}.stage{height:238px;display:grid;place-items:end center;background:#fff;border-bottom:1px solid #eeeae3;overflow:hidden;position:relative}.stage:after,.dstage:after{content:"";position:absolute;bottom:17px;left:14%;right:14%;height:1px;background:linear-gradient(90deg,transparent,#e9e4dc,transparent)}canvas.sprite{height:220px;width:auto;max-width:96%;image-rendering:pixelated;image-rendering:crisp-edges;transform:translateY(8px);position:relative;z-index:1}.cb{padding:12px 14px 15px;min-height:145px}.num{font:700 .66rem ui-monospace,monospace;color:var(--accent)}.name{font-weight:900;font-size:1.02rem;line-height:1.35;margin:4px 0 1px;overflow-wrap:anywhere}.roman{font-size:.71rem;color:var(--muted);min-height:1.2em;overflow-wrap:anywhere}.role{margin-top:8px;font-size:.77rem;line-height:1.5;color:#4f4b45;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.empty{grid-column:1/-1;text-align:center;padding:70px;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
dialog{width:min(980px,calc(100% - 22px));max-height:calc(100dvh - 22px);padding:0;border:1px solid var(--line);border-radius:22px;background:#fff;box-shadow:0 30px 90px rgba(35,33,29,.22)}dialog::backdrop{background:rgba(40,38,34,.28);backdrop-filter:blur(5px)}.detail{max-height:calc(100dvh - 22px);overflow:auto}.dtop{display:grid;grid-template-columns:310px minmax(0,1fr);border-bottom:1px solid var(--line)}.dstage{min-height:390px;display:grid;place-items:end center;position:relative;overflow:hidden;border-right:1px solid var(--line);background:#fff}.dstage:after{bottom:29px}canvas.dsprite{height:360px;width:auto;max-width:100%;image-rendering:pixelated;transform:translateY(14px);position:relative;z-index:1}.dhead{padding:52px 32px 27px;position:relative}.close{position:absolute;right:13px;top:13px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:1.2rem}.didx{font:800 .7rem ui-monospace,monospace;color:var(--accent);letter-spacing:.1em}.dname{font-size:clamp(1.6rem,4vw,2.7rem);font-weight:900;line-height:1.12;margin:9px 0 4px}.droman{color:var(--muted);font-size:.9rem;margin-bottom:21px}.meta{display:grid;gap:11px}.mrow{display:grid;grid-template-columns:80px 1fr;gap:9px;font-size:.84rem;line-height:1.6}.mlabel{font-weight:700;color:var(--muted)}.mvalue{color:#4f4b45;overflow-wrap:anywhere}.dcontent{padding:26px 32px 32px}.label{color:var(--accent);font-size:.72rem;font-weight:900;letter-spacing:.13em;margin-bottom:7px}.summary{font-size:.95rem;line-height:1.9;margin:0 0 23px;color:#36332f}.quote{margin:0 0 24px;padding:17px 19px;background:#f8f7f3;border-left:3px solid var(--blue);border-radius:0 13px 13px 0;line-height:1.85}.boxes{display:grid;grid-template-columns:1fr 1fr;gap:11px}.box{border:1px solid var(--line);background:#fbfaf7;border-radius:13px;padding:13px 15px}.box .mlabel{font-size:.7rem;margin-bottom:5px}.box .mvalue{font-size:.84rem;line-height:1.5}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.nav button{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 14px;font-weight:700}.noscr{overflow:hidden}
@media(max-width:920px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.dtop{grid-template-columns:270px 1fr}}
@media(max-width:680px){.shell{width:calc(100% - 18px)}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stage{height:187px}canvas.sprite{height:178px}.cb{padding:10px;min-height:135px}.name{font-size:.9rem}.roman{font-size:.65rem}.role{font-size:.69rem}dialog{width:100%;height:100dvh;max-height:100dvh;border:0;border-radius:0}.detail{max-height:100dvh}.dtop{grid-template-columns:1fr}.dstage{min-height:325px;border-right:0;border-bottom:1px solid var(--line)}canvas.dsprite{height:305px}.dhead{padding:27px 20px 21px}.dcontent{padding:21px 20px calc(28px + env(safe-area-inset-bottom))}.boxes{grid-template-columns:1fr}.mrow{font-size:.79rem}.summary,.quote{font-size:.89rem}}
@media(max-width:360px){.grid{grid-template-columns:1fr}.stage{height:220px}canvas.sprite{height:205px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="hero"><div class="shell"><a class="back" href="./index.html">← 本編へ戻る</a><div class="eyebrow">CHARACTER ARCHIVE</div><h1>登場人物紹介</h1><p class="sub">人物カードを選ぶと、プロフィールと台詞を表示します。</p></div></header>
<div class="toolbar"><div class="shell"><div class="row"><label class="search"><input id="q" type="search" placeholder="名前・肩書き・出身などで検索"></label><div id="count" class="count"></div></div><div id="filters" class="filters"></div></div></div>
<main class="shell"><section id="grid" class="grid"></section></main>
<dialog id="dlg"><article id="detail" class="detail"></article></dialog>
<script>window.CHARACTERS=[];</script>
<script src="./assets/characters/data-01.js"></script>
<script src="./assets/characters/data-02.js"></script>
<script src="./assets/characters/data-03.js"></script>
<script src="./assets/characters/data-04.js"></script>
<script>
(()=>{"use strict";
const C=window.CHARACTERS,g=document.querySelector("#grid"),q=document.querySelector("#q"),cnt=document.querySelector("#count"),fs=document.querySelector("#filters"),dlg=document.querySelector("#dlg"),detail=document.querySelector("#detail");
const works=[["all","すべて"],["カラバァタン共和国物語","カラバァタン"],["ハーロピノン共和国物語","ハーロピノン"],["スクニューネ共和国物語","スクニューネ"],["メイド・オブ・サン","メイド・オブ・サン"],["三次元保安官","三次元保安官"],["ブックキーパー","ブックキーパー"],["偽書","偽書"],["補遺","補遺"]];
let work="all",active=0,timer=null;const cache=new Map(),norm=s=>(s||"").normalize("NFKC").toLowerCase();
function img(src){if(cache.has(src))return cache.get(src);const i=new Image();const p=new Promise((ok,bad)=>{i.onload=()=>ok(i);i.onerror=bad});i.src=src;cache.set(src,p);return p}
function sprite(ch,cls){const c=document.createElement("canvas");c.className=cls;c.width=97;c.height=118;c.setFrame=async f=>{try{const a=await img(ch.atlas.src),n={neutral:0,step1:1,step2:2}[f]||0,x=ch.atlas.x+n*97,y=ch.atlas.y,ctx=c.getContext("2d",{alpha:true});ctx.clearRect(0,0,97,118);ctx.imageSmoothingEnabled=false;ctx.drawImage(a,x,y,97,118,0,0,97,118)}catch(e){c.setAttribute("aria-label",ch.name+"（画像読込失敗）")}};c.setAttribute("role","img");c.setAttribute("aria-label",ch.name);c.setFrame("neutral");return c}
works.forEach(([k,l],i)=>{const b=document.createElement("button");b.className="filter"+(i?"":" on");b.textContent=l;b.onclick=()=>{work=k;[...fs.children].forEach(x=>x.classList.toggle("on",x===b));render()};fs.append(b)});
function match(ch){if(work!=="all"&&!ch.works.includes(work))return false;const s=norm(q.value.trim());return !s||norm([ch.name,ch.romanization,ch.origin,ch.title,ch.summary,ch.quote,ch.combat_style,ch.works].join(" ")).includes(s)}
function animate(s,on){clearInterval(s._t);s._t=null;s.setFrame("neutral");if(!on||matchMedia("(prefers-reduced-motion: reduce)").matches)return;let n=0,a=["neutral","step1","neutral","step2"];s._t=setInterval(()=>{n=(n+1)%4;s.setFrame(a[n])},210)}
function card(ch,i){const b=document.createElement("button");b.className="card";b.type="button";const st=document.createElement("div");st.className="stage";const sp=sprite(ch,"sprite");st.append(sp);const cb=document.createElement("div");cb.className="cb";cb.innerHTML=`<div class="num">${String(i+1).padStart(2,"0")}</div><div class="name"></div><div class="roman"></div><div class="role"></div>`;cb.querySelector(".name").textContent=ch.name;cb.querySelector(".roman").textContent=ch.romanization;cb.querySelector(".role").textContent=ch.title;b.append(st,cb);b.onmouseenter=()=>animate(sp,true);b.onmouseleave=()=>animate(sp,false);b.onfocus=()=>animate(sp,true);b.onblur=()=>animate(sp,false);b.onclick=()=>open(i);return b}
function render(){g.replaceChildren();const v=[];C.forEach((c,i)=>{if(match(c))v.push([c,i])});cnt.textContent=`${v.length} / ${C.length}`;if(!v.length){const e=document.createElement("div");e.className="empty";e.textContent="条件に合う人物が見つかりませんでした。";g.append(e);return}v.forEach(([c,i])=>g.append(card(c,i)))}
function E(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}function row(l,v){const r=E("div","mrow");r.append(E("div","mlabel",l),E("div","mvalue",v));return r}function box(l,v){const b=E("div","box");b.append(E("div","mlabel",l),E("div","mvalue",v));return b}
function open(i){active=i;const ch=C[i];detail.replaceChildren();const top=E("div","dtop"),st=E("div","dstage"),sp=sprite(ch,"dsprite"),hd=E("div","dhead"),cl=E("button","close","×");cl.onclick=()=>dlg.close();hd.append(cl,E("div","didx",`CHARACTER ${String(i+1).padStart(2,"0")}`),E("div","dname",ch.name),E("div","droman",ch.romanization));const m=E("div","meta");m.append(row("出身",ch.origin),row("肩書き",ch.title));hd.append(m);st.append(sp);top.append(st,hd);const dc=E("div","dcontent");dc.append(E("div","label","PROFILE"),E("p","summary",ch.summary),E("div","label","VOICE"),E("blockquote","quote",ch.quote));const bs=E("div","boxes");bs.append(box("戦闘スタイル",ch.combat_style),box("登場作品",ch.works));dc.append(bs);const nv=E("div","nav"),pr=E("button","","← 前の人物"),nx=E("button","","次の人物 →");pr.onclick=()=>open((active-1+C.length)%C.length);nx.onclick=()=>open((active+1)%C.length);nv.append(pr,nx);dc.append(nv);detail.append(top,dc);if(!dlg.open)dlg.showModal();document.body.classList.add("noscr");clearInterval(timer);if(!matchMedia("(prefers-reduced-motion: reduce)").matches){let n=0,a=["neutral","step1","neutral","step2"];timer=setInterval(()=>{n=(n+1)%4;sp.setFrame(a[n])},290)}detail.scrollTop=0}
dlg.addEventListener("close",()=>{document.body.classList.remove("noscr");clearInterval(timer)});dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});q.addEventListener("input",render);render();
})();
</script>
</body></html>
